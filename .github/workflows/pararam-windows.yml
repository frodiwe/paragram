name: Pararam Desktop for Windows

on:
  push:
    paths-ignore:
      - '**.md'
      - 'pararam/mock_server.py'
  pull_request:
  workflow_dispatch:

jobs:

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      QT: qt6

    defaults:
      run:
        shell: cmd

    steps:
      # Checked out into the workspace (private repositories get their
      # credentials only there), then copied to C:, which has the disk
      # space the dependencies need, like the upstream Telegram workflow.
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The Debug build of Telegram Desktop needs more memory than the
      # runner has (C1060 "compiler is out of heap space") without this.
      - name: Page file.
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Prepare directories.
        run: |
          for %%I in ("%GITHUB_WORKSPACE%") do set REPO_NAME=%%~nxI
          echo REPO_NAME=%REPO_NAME%>>%GITHUB_ENV%
          mkdir %userprofile%\TBuild\Libraries
          robocopy "%GITHUB_WORKSPACE%" "%userprofile%\TBuild\%REPO_NAME%" /E /NFL /NDL /NJH /NJS /NP > nul
          if %errorlevel% geq 8 exit /b 1
          echo TBUILD=%userprofile%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%userprofile%\TBuild\Libraries\win64>>%GITHUB_ENV%
          exit /b 0

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # The first runs on a new repository build all the dependencies
      # from source, which may take longer than one job can run. Progress
      # is cached even if the job times out, re-run the workflow to resume.
      - name: Restore ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-third-party-

      - name: Restore Libraries cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-qt6-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-x64-qt6-libs-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-x64-qt6-libs-

      - name: Remember the time.
        shell: bash
        run: echo "LIBS_STARTED=$(date +%s)" >> $GITHUB_ENV

      - name: Libraries.
        id: libs
        timeout-minutes: 290
        continue-on-error: true
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Save Libraries cache.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LibrariesPath }}
          key: ${{ runner.OS }}-x64-qt6-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}

      - name: Check the remaining time.
        id: budget
        shell: bash
        run: |
          ELAPSED=$(( ($(date +%s) - LIBS_STARTED) / 60 ))
          echo "Libraries took $ELAPSED minutes."
          if [ "${{ steps.libs.outcome }}" != "success" ]; then
            echo "::error::Libraries failed or timed out, see the Libraries step. Progress is cached, re-run the workflow to continue."
            echo "build=false" >> $GITHUB_OUTPUT
            exit 1
          elif [ $ELAPSED -gt 120 ]; then
            echo "::warning::Libraries are built and cached now, re-run the workflow to build Pararam Desktop."
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      # The libraries are built in Debug only (skip-release), like in the
      # upstream Telegram workflow, so the app is built in Debug too.
      - name: Pararam Desktop build.
        if: steps.budget.outputs.build == 'true'
        run: |
          rem The object files do not fit on C:, keep them on D:.
          mkdir D:\out
          mklink /J %TBUILD%\%REPO_NAME%\out D:\out
          cd /d %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Debug --parallel

      - name: Package.
        if: steps.budget.outputs.build == 'true'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir artifact
          copy %OUT%\Telegram.exe artifact\Pararam.exe
          copy %TBUILD%\%REPO_NAME%\pararam\README.md artifact\README.md

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: steps.budget.outputs.build == 'true'
        with:
          name: Pararam Desktop x64
          path: artifact\
          retention-days: 30
